<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const E=s=>`<span class="e">${s}</span>`;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

  id(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m},

  Ry(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m},
  Rx(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m},
  Rz(a){const m=M4.id(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m},

  ch(...ms){return ms.reduce((a,b)=>M4.mul(a,b))}
};

/* =========================================================
   GEOMETRIA (flat shading, colori per vertice, alfa = emissivo)
   ========================================================= */
class MB{
  constructor(){this.p=[];this.n=[];this.c=[]}
  tri(a,b,c,col,e,center,ns){if(ns){const q=[a,b,c];for(let i=0;i<3;i++){const v=q[i],n=ns[i];this.p.push(v[0],v[1],v[2]);this.n.push(n[0],n[1],n[2]);this.c.push(col[0],col[1],col[2],e||0)}return}let ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
    if(center){const mx=(a[0]+b[0]+c[0])/3-center[0],my=(a[1]+b[1]+c[1])/3-center[1],mz=(a[2]+b[2]+c[2])/3-center[2];if(nx*mx+ny*my+nz*mz<0){nx=-nx;ny=-ny;nz=-nz}}
    else if(ny<0){nx=-nx;ny=-ny;nz=-nz}
    for(const v of [a,b,c]){this.p.push(v[0],v[1],v[2]);this.n.push(nx,ny,nz);this.c.push(col[0],col[1],col[2],e||0)}}
  quad(a,b,c,d,col,e,center){this.tri(a,b,c,col,e,center);this.tri(a,c,d,col,e,center)}
}
// primitive in coordinate locali trasformate da m
const nrm=(v,c)=>{const d=[v[0]-c[0],v[1]-c[1],v[2]-c[2]],l=Math.hypot(...d)||1;return[d[0]/l,d[1]/l,d[2]/l]};
function addCyl(mb,m,r0,r1,h,seg,col,e,cap){const ctr=M4.ap(m,[0,h/2,0]);const a0=M4.ap(m,[0,0,0]),a1=M4.ap(m,[0,h,0]);const ring=(r,y)=>Array.from({length:seg},(_,i)=>{const a=i/seg*Math.PI*2;return M4.ap(m,[Math.cos(a)*r,y,Math.sin(a)*r])});
  const A=ring(r0,0),B=ring(r1,h);const NA=A.map(v=>nrm(v,a0)),NB=B.map(v=>nrm(v,a1));for(let i=0;i<seg;i++){const j=(i+1)%seg;mb.tri(A[i],A[j],B[j],col,e,ctr,[NA[i],NA[j],NB[j]]);mb.tri(A[i],B[j],B[i],col,e,ctr,[NA[i],NB[j],NB[i]])}
  if(cap){const top=M4.ap(m,[0,h,0]);for(let i=0;i<seg;i++)mb.tri(B[i],B[(i+1)%seg],top,col,e,ctr)}}
function addCone(mb,m,r,h,seg,col,e){const ctr=M4.ap(m,[0,h*.3,0]),tip=M4.ap(m,[0,h,0]);const A=Array.from({length:seg},(_,i)=>{const a=i/seg*Math.PI*2;return M4.ap(m,[Math.cos(a)*r,0,Math.sin(a)*r])});
  for(let i=0;i<seg;i++){mb.tri(A[i],A[(i+1)%seg],tip,col,e,ctr)}}
function addBox(mb,m,w,h,d,col,e){const x=w/2,z=d/2;const P=[[-x,0,-z],[x,0,-z],[x,0,z],[-x,0,z],[-x,h,-z],[x,h,-z],[x,h,z],[-x,h,z]].map(v=>M4.ap(m,v));const ctr=M4.ap(m,[0,h/2,0]);
  const F=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];for(const f of F)mb.quad(P[f[0]],P[f[1]],P[f[2]],P[f[3]],col,e,ctr)}
const ICO=(()=>{const t=(1+Math.sqrt(5))/2;const v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(p=>{const l=Math.hypot(...p);return p.map(x=>x/l)});
  const f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];return{v,f}})();
const ICO2=(()=>{const v=ICO.v.map(p=>p.slice()),f=[],mid={};const M=(a,b)=>{const k=a<b?a+'_'+b:b+'_'+a;if(mid[k]!=null)return mid[k];const p=[(v[a][0]+v[b][0])/2,(v[a][1]+v[b][1])/2,(v[a][2]+v[b][2])/2],l=Math.hypot(...p);v.push(p.map(x=>x/l));return mid[k]=v.length-1};
  for(const [a,b,c] of ICO.f){const ab=M(a,b),bc=M(b,c),ca=M(c,a);f.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca])}return{v,f}})();
function addRock(mb,m,r,col,e,R){const v=ICO2.v.map(p=>{const k=r*(.93+R()*.12);return M4.ap(m,[p[0]*k,p[1]*k*.7,p[2]*k])});const ctr=M4.ap(m,[0,0,0]);const N=v.map(q=>nrm(q,ctr));for(const f of ICO2.f)mb.tri(v[f[0]],v[f[1]],v[f[2]],col,e,ctr,[N[f[0]],N[f[1]],N[f[2]]])}
function addBlob(mb,m,r,col,e){const c0=M4.ap(m,[0,0,0]);const v=ICO2.v.map(p=>M4.ap(m,[p[0]*r,p[1]*r,p[2]*r]));const N=v.map(q=>nrm(q,c0));for(const f of ICO2.f)mb.tri(v[f[0]],v[f[1]],v[f[2]],col,e,c0,[N[f[0]],N[f[1]],N[f[2]]])}
function addDisc(mb,m,r,seg,col,e){const c=M4.ap(m,[0,0,0]);const A=Array.from({length:seg},(_,i)=>{const a=i/seg*Math.PI*2;return M4.ap(m,[Math.cos(a)*r,0,Math.sin(a)*r])});for(let i=0;i<seg;i++)mb.tri(A[i],A[(i+1)%seg],c,col,e)}

/* =========================================================
   WEBGL
   ========================================================= */
const cv=$('gl');const gl=cv.getContext('webgl',{antialias:true})||cv.getContext('experimental-webgl');
if(!gl){document.body.innerHTML='<p style="color:#fff;padding:20px;font-family:sans-serif">Questo dispositivo non supporta WebGL.</p>';throw new Error('no webgl')}
const VS=`attribute vec3 p;attribute vec3 n;attribute vec4 c;uniform mat4 uVP,uM;varying vec3 vW,vN;varying vec4 vC;

const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec3 vW,vN;varying vec4 vC;
uniform vec3 uSun,uSunC,uSky,uGnd,uFog,uCam,uTP,uTD;uniform float uAmb,uFN,uFF,uTorch,uA,uTint,uFrost,uWet;
void main(){vec3 N=normalize(vN);float h=N.y*.5+.5;vec3 L=mix(uGnd,uSky,h)*uAmb+uSunC*max(dot(N,uSun),0.);
 if(uTorch>0.){vec3 d=vW-uTP;float dist=length(d);vec3 dn=d/max(dist,.001);float sp=smoothstep(.80,.94,dot(dn,uTD));float att=clamp(1.-dist/24.,0.,1.);L+=vec3(1.,.92,.72)*sp*att*att*2.6*uTorch*max(dot(N,-dn),.25);}
 vec3 col=vC.rgb*mix(L,vec3(1.),vC.a);
 col=mix(col,vec3(1.,.3,.25),uTint);
 col=mix(col,col*vec3(.5,.62,.52)+vec3(.02,.05,.03),uWet);
 col=mix(col,vec3(.9,.95,1.)*(.55+.45*L.b),uFrost*smoothstep(.55,.95,N.y));
 float d=length(vW-uCam);float f=clamp((d-uFN)/(uFF-uFN),0.,1.);
 gl_FragColor=vec4(mix(col,uFog,f),uA);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}

const A={p:gl.getAttribLocation(prog,'p'),n:gl.getAttribLocation(prog,'n'),c:gl.getAttribLocation(prog,'c')};
const U={};['uVP','uM','uSun','uSunC','uSky','uGnd','uFog','uCam','uTP','uTD','uAmb','uFN','uFF','uTorch','uA','uTint','uFrost','uWet'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
gl.enable(gl.DEPTH_TEST);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
function upload(mb){if(!mb.p.length)return null;const o={count:mb.p.length/3};
  o.pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,o.pb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mb.p),gl.STATIC_DRAW);
  o.nb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,o.nb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mb.n),gl.STATIC_DRAW);
  o.cb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,o.cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mb.c),gl.STATIC_DRAW);return o}
